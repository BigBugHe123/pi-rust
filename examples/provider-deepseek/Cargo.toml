[package]
name = "rpi-example-provider-deepseek"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "DeepSeek native streaming provider extension smoke-test example"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rpi-ai = { workspace = true, features = ["providers"] }
rpi-plugin-sdk = { workspace = true }
rpi-provider-runtime = { path = "../../packages/provider-runtime", version = "0.3.24" }
serde_json = { workspace = true }

[dev-dependencies]
rpi-extensions = { workspace = true }
tokio = { workspace = true, features = ["net"] }

