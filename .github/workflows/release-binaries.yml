name: Release binaries

# Builds prebuilt `rpi` binaries and attaches them to the GitHub Release for a
# tag. This is what makes `curl -fsSL .../install.sh | sh` work and what removes
# the "you need a Rust toolchain and a C linker" barrier to trying the CLI.
#
# Main CI calls release.yml after tests; that workflow publishes crates.io
# and calls this workflow directly once the Release PR's tag is ready.

on:
  workflow_call:
    inputs:
      tag:
        description: Existing tag to build
        required: true
        type: string
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and attach binaries to (e.g. v0.3.0)"
        required: true

permissions:
  contents: write

concurrency:
  group: release-binaries-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    if: github.repository == 'bigfish1913/pi-rust'
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          # GitHub-hosted arm64 Linux runners; available for public repos.
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: macos-15-intel
            target: x86_64-apple-darwin
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install manifest tooling
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Resolve version
        id: version
        shell: bash
        run: |
          version="$(cargo metadata --no-deps --format-version 1 --locked \
            | jq -r '.packages[] | select(.name == "rpi-cli") | .version' | head -n 1)"
          if [[ -z "${version}" || "${version}" == "null" ]]; then
            echo "Could not determine the rpi-cli workspace version." >&2
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "Building rpi ${version} for ${{ matrix.target }}"

      - name: Build release binary
        run: cargo build -p rpi-cli --release --locked --target ${{ matrix.target }}

      - name: Smoke test Intel macOS binary
        if: matrix.target == 'x86_64-apple-darwin'
        run: target/${{ matrix.target }}/release/rpi --version

      - name: Stage artifact
        id: stage
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          target="${{ matrix.target }}"
          name="rpi-v${version}-${target}"
          mkdir -p dist

          if [[ "${target}" == *windows* ]]; then
            bin="target/${target}/release/rpi.exe"
          else
            bin="target/${target}/release/rpi"
          fi

          if [[ ! -f "${bin}" ]]; then
            echo "expected binary at ${bin} but it is missing" >&2
            exit 1
          fi

          cp "${bin}" dist/
          cp LICENSE dist/ 2>/dev/null || true
          cp NOTICE dist/ 2>/dev/null || true
          cp README.md dist/ 2>/dev/null || true

          if [[ "${{ matrix.archive }}" == "zip" ]]; then
            (cd dist && 7z a -tzip "../${name}.zip" . >/dev/null)
            asset="${name}.zip"
          else
            tar -czf "${name}.tar.gz" -C dist .
            asset="${name}.tar.gz"
          fi

          # Publish a checksum next to every archive so install.sh can verify it.
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${asset}" > "${asset}.sha256"
          else
            shasum -a 256 "${asset}" > "${asset}.sha256"
          fi

          echo "asset=${asset}" >> "${GITHUB_OUTPUT}"
          echo "checksum=${asset}.sha256" >> "${GITHUB_OUTPUT}"

      - name: Describe verified prebuilt distribution
        shell: bash
        run: |
          python scripts/prebuilt-release.py describe \
            --archive "${{ steps.stage.outputs.asset }}" \
            --target "${{ matrix.target }}" \
            --version "${{ steps.version.outputs.version }}" \
            --commit "$(git rev-parse HEAD)" \
            --output "${{ steps.stage.outputs.asset }}.prebuilt.json"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            ${{ steps.stage.outputs.asset }}
            ${{ steps.stage.outputs.checksum }}
            ${{ steps.stage.outputs.asset }}.prebuilt.json
          if-no-files-found: error
          overwrite: true

  release:
    name: Attach binaries to the release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Install manifest tooling
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: List artifacts
        run: ls -la dist

      - name: Verify all targets and assemble CLI manifest
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          python scripts/prebuilt-release.py assemble --directory dist \
            --tag "${TAG}" --commit "$(git rev-parse HEAD)" --output rpi-release.json

      - name: Publish to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(dist/*.tar.gz dist/*.zip dist/*.sha256)
          if gh release view "${TAG}" >/dev/null 2>&1; then
            # Discovery must not advertise archives while they are being replaced.
            if gh release view "${TAG}" --json assets --jq '.assets[].name' | grep -qx rpi-release.json; then
              gh release delete-asset "${TAG}" rpi-release.json --yes
            fi
            gh release upload "${TAG}" "${assets[@]}" --clobber
          else
            gh release create "${TAG}" "${assets[@]}" \
              --title "rpi ${TAG}" \
              --generate-notes
          fi
          # Upload last: a manifest means all five verified archives are ready.
          gh release upload "${TAG}" rpi-release.json --clobber

  channels:
    needs: release
    uses: ./.github/workflows/release-channels.yml
    with:
      tag: ${{ inputs.tag || github.ref_name }}
    secrets: inherit
